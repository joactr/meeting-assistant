[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]
exclude = ["crates/vendor"]

[workspace.package]
version = "1.0.0-beta.7"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "=1.0.104"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.48.0", features = ["full"] }
sha2 = "=0.10.9"
rand = "=0.8.8"
hex = "=0.4.3"
zeroize = { version = "=1.8.2", features = ["derive"] }
uuid = { version = "=1.18.1", features = ["v4", "serde"] }
crossbeam-queue = "=0.3.12"
libc = "=0.2.177"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }

[patch.crates-io]
tauri-plugin-updater = { path = "crates/vendor/tauri-plugin-updater-2.14.0" }
