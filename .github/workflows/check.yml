name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Install Linux native development prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libpipewire-0.3-dev libasound2-dev libopus-dev libspeexdsp-dev
      - name: Install pinned tooling
        run: |
          python -m pip install uv==0.13.5
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
      - run: python tooling/run.py bootstrap
      - run: python tooling/run.py check
      - run: python tooling/run.py test
      - run: python tooling/run.py build
      - run: python tooling/run.py audit
      # Compilation on experimental targets is not proof of real capture support.
