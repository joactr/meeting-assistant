name: Protected release assembly
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected version tag matching release.toml
        required: true
        type: string
      acceptance_run_id:
        description: Same-commit successful Windows acceptance run containing acceptance-evidence artifact
        required: true
        type: string
      publish:
        description: Publish after all draft assets are uploaded and verified
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  native:
    environment: release-approval
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: [self-hosted, Windows, X64, meeting-assistant-release]
          - target: darwin-aarch64
            runner: [self-hosted, macOS, ARM64, meeting-assistant-release]
          - target: darwin-x86_64
            runner: [self-hosted, macOS, X64, meeting-assistant-release]
          - target: linux-x86_64
            runner: [self-hosted, Linux, X64, meeting-assistant-release]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Validate actual tag and acceptance source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
          GH_RELEASE_TOKEN: ${{ github.token }}
        run: python tooling/release_inputs.py
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: acceptance-evidence
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Frozen source and runtime checks
        run: |
          python -m pip install uv==0.13.5
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt --component clippy
          python tooling/run.py bootstrap
          python tooling/run.py check
          python tooling/run.py test
          python tooling/run.py smoke
          python tooling/run.py audit
      - name: Build native signed installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE_THUMBPRINT: ${{ secrets.WINDOWS_CERTIFICATE_THUMBPRINT }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python tooling/run.py build
          python tooling/run.py package
          python tooling/release.py manifest
          python tooling/run.py release-check
      - name: Build isolated CPU runtime artifacts for review
        shell: python
        run: |
          import json, pathlib, platform, subprocess, tomllib
          version = tomllib.loads(pathlib.Path('release.toml').read_text(encoding='utf-8'))['version']
          system = {'Windows': 'windows', 'Darwin': 'macos', 'Linux': 'linux'}[platform.system()]
          architecture = {'AMD64': 'x86_64', 'x86_64': 'x86_64', 'arm64': 'aarch64', 'aarch64': 'aarch64'}[platform.machine()]
          target = system + '-' + architecture
          for family in ('whisper', 'sherpa', 'pyannote', 'embeddings', 'azure-speech'):
              entry = json.loads(pathlib.Path('engine/catalog/runtimes', family + '.json').read_text(encoding='utf-8'))
              if target in entry.get('unsupported_platforms', {}):
                  print(f'{family} unavailable on {target}: ' + entry['unsupported_platforms'][target])
                  continue
              subprocess.run(['uv', 'run', '--frozen', 'python', 'workers/build.py', family, '--accept-runtime-license', '--version', version, '--output', 'artifacts/runtimes'], check=True)
      - name: Stage target-specific artifact inventories
        shell: python
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          import pathlib, shutil, sys
          sys.path.insert(0, 'tooling')
          import release
          target = __import__('os').environ['RELEASE_TARGET']
          destination = pathlib.Path('artifacts/staging') / target
          destination.mkdir(parents=True, exist_ok=False)
          for payload in release.packaged_files():
              shutil.copyfile(payload, destination / payload.name)
              signature = payload.with_name(payload.name + '.sig')
              if signature.is_file():
                  shutil.copyfile(signature, destination / signature.name)
          for inventory in release.OUTPUT.iterdir():
              if inventory.is_file() and inventory.name != 'latest.json':
                  shutil.copyfile(inventory, destination / (target + '-' + inventory.name))
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bundles-${{ matrix.target }}
          path: artifacts/staging/${{ matrix.target }}/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtimes-${{ matrix.target }}
          path: |
            artifacts/runtimes/**/*.zip
            artifacts/runtimes/**/*catalog.json
            artifacts/runtimes/**/*.sig
          if-no-files-found: error
  assemble:
    needs: native
    environment: release-approval
    runs-on: [self-hosted, Windows, X64, meeting-assistant-release]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: bundles-*
          merge-multiple: true
          path: target/release/bundle
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          pattern: runtimes-*
          merge-multiple: true
          path: artifacts/runtimes
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: acceptance-evidence
          run-id: ${{ inputs.acceptance_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify and assemble draft without overwriting assets
        env:
          GH_RELEASE_TOKEN: ${{ github.token }}
          PUBLISH_RELEASE: ${{ inputs.publish }}
        shell: python
        run: |
          import os, pathlib, shutil, subprocess, sys
          subprocess.run([sys.executable, '-m', 'pip', 'install', 'uv==0.13.5'], check=True)
          subprocess.run(['uv', 'sync', '--frozen'], check=True)
          key = os.environ.get('MEETING_CATALOG_SIGNING_KEY_FILE')
          audits = os.environ.get('MEETING_RUNTIME_LICENSE_AUDIT_DIRECTORY')
          if not key or not audits:
              raise SystemExit('Provision catalog signing key and actual artifact-bound runtime review files')
          for catalog in pathlib.Path('artifacts/runtimes').rglob('*catalog.json'):
              audit = pathlib.Path(audits) / (catalog.name + '.review.json')
              subprocess.run([str(pathlib.Path('engine/.venv/Scripts/python.exe').resolve()), 'workers/finalize.py', str(catalog), '--license-audit', str(audit), '--signing-key', key], check=True)
          python = str(pathlib.Path('engine/.venv/Scripts/python.exe').resolve())
          subprocess.run([python, 'tooling/release.py', 'manifest'], check=True)
          subprocess.run([python, 'tooling/run.py', 'release-check'], check=True)
          output = pathlib.Path('artifacts/release')
          for inventory in pathlib.Path('target/release/bundle').glob('*.json'):
              shutil.copyfile(inventory, output / inventory.name)
          for notice in pathlib.Path('target/release/bundle').glob('*.txt'):
              shutil.copyfile(notice, output / notice.name)
          command = [python, 'tooling/publish.py', '--allow-network']
          if os.environ.get('PUBLISH_RELEASE', '').lower() == 'true':
              command.append('--publish')
          subprocess.run(command, check=True)
