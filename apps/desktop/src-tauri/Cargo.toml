[package]
name = "meeting-assistant-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
toml = "=0.9.8"
serde_json.workspace = true

[dependencies]
native-host = { path = "../../../crates/native-host" }
audio-core = { path = "../../../crates/audio-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
url = "=2.5.7"
futures-util = "=0.3.31"
tokio-tungstenite = "=0.28.0"
reqwest.workspace = true
uuid.workspace = true
zeroize.workspace = true
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.3.6"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-clipboard-manager = "=2.3.2"
rfd = "=0.15.4"
webbrowser = "=1.2.5"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
