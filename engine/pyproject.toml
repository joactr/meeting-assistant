[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "meeting-assistant"
version = "1.0.0b7"
description = "Independent local-first developer meeting notebook"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.159.1",
  "pydantic==2.14.1",
  "httpx==0.28.1",
  "uvicorn==0.54.0",
  "websockets==15.0.1",
  "reportlab==5.1.0",
  "cryptography==50.0.0",
  "pyrage==1.4.0",
  "jsonschema==4.26.0",
  "platformdirs==4.13.5",
  "sqlite-vec==0.1.9",
  "tzdata==2026.2",
]

[project.scripts]
meeting-assistant = "meeting_assistant.__main__:main"

[dependency-groups]
dev = [
  "ruff==0.17.1",
  "pyright==1.1.414",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pyinstaller==6.22.3",
  "pip-audit==2.10.1",
  "cmake==3.31.10",
]

[tool.hatch.build.targets.wheel]
packages = ["meeting_assistant"]

[tool.uv.workspace]
members = []

# Run via `just test`: pytest -c engine/pyproject.toml --rootdir . (paths below are root-relative).
[tool.pytest.ini_options]
pythonpath = ["engine"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["meeting_assistant"]
extraPaths = ["."]
stubPath = "typings"
pythonVersion = "3.12"
typeCheckingMode = "strict"
